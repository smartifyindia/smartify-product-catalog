name: Release catalog

on:
  push:
    tags:
      - 'catalog-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Verify the committed catalog
        run: npm run verify-catalog

      - name: Publish the verified immutable agent catalog to R2
        env:
          # This token must be limited to object read/write for this bucket;
          # it needs no Worker, DNS, or account-administration permissions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.SMARTIFY_CATALOG_R2_PUBLISH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b9f8db8151b55e4e33b0190fd0805f38
          AGENT_CATALOG_R2_BUCKET: smartify-images
        run: >-
          npm run publish:agent-catalog --
          --bucket "$AGENT_CATALOG_R2_BUCKET"
          --producer-repository "$GITHUB_REPOSITORY"
          --producer-commit "$GITHUB_SHA"

      - name: Write checksums
        run: node scripts/write-checksums.mjs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            products.json
            products.source.json
            checksums.txt
