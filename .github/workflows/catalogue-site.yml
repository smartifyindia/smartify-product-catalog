name: Catalogue website

on:
  pull_request:
    paths: ['catalogue/**', '.github/workflows/catalogue-site.yml', 'package.json', 'package-lock.json', '.gitattributes']
  push:
    branches: [main]
    paths: ['catalogue/**', '.github/workflows/catalogue-site.yml', 'package.json', 'package-lock.json', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalogue website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run verify-catalog
      - run: npm run check-catalog
      - run: npm run catalogue:test
      - run: npm run catalogue:build
      - run: npm run catalogue:bundle

  deploy:
    name: Publish catalogue
    needs: validate
    if: github.repository == 'smartifyindia/smartify-product-catalog' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: catalogue-production
      url: https://catalog.smartify.in
    concurrency:
      group: catalogue-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run catalogue:build
      - name: Provision storage, verify PDFs and publish
        run: node catalogue/scripts/deploy-ci.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CATALOGUE_PRODUCTION_APPROVED: 'true'
      - name: Verify deployed revision and both downloads
        run: node catalogue/scripts/verify-live.mjs
