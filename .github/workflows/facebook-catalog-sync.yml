name: Sync Meta catalog

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-catalog.mjs
      - run: node facebook-catalog-push.js
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_CATALOG_ID: ${{ secrets.FB_CATALOG_ID }}
          FB_GRAPH_VERSION: v26.0
